<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>Rock Paper Scissors Game</h1>

  <script>
    // This function will randomly return either "rock", "paper", or "scissors", to represent the computer's choice in the game.
    function getComputerChoice () {
      let num = Math.random();
        if (num <= 0.33) {
          return "rock"
        }
        else if (num <= 0.66 && num > 0.33) {
          return "paper"
        }
        else {
          return "scissors"
        }
    }
    console.log(getComputerChoice());

    // This function should prompt the user to input either "rock", "paper", or "scissors". It should return the user's choice.
    function getHumanChoice () {
      return prompt("Please enter rock, paper, or scissors");
    }
    console.log(getHumanChoice());


    // Score keeping variables
    let humanScore = 0;
    let computerScore = 0;

    // Function to play a single round
    function playRound (humanChoice, computerChoice) {
      if (computerChoice === humanChoice) {
        console.log("Draw");
      } else if (humanChoice === 'rock' && computerChoice === 'paper' || humanChoice === 'paper' && computerChoice === 'scissors' || humanChoice === 'scissors' && computerChoice === 'rock') {
        console.log(`You lose, ${computerChoice} beats ${humanChoice}`);
        computerScore++;
      } else {
        console.log(`You win, ${humanChoice} beats ${computerChoice}`);
        humanScore++;
      }
    }

    function playGame() {
      playRound(getHumanChoice(), getComputerChoice());
      playRound(getHumanChoice(), getComputerChoice());
      playRound(getHumanChoice(), getComputerChoice());
      playRound(getHumanChoice(), getComputerChoice());
      playRound(getHumanChoice(), getComputerChoice());

    }

    playGame();

  </script>
</body>
</html>
